[project]
name = "spotter-analyze"
version = "0.1.0"
description = "Reduce Spotter .spot telemetry from KovaaK's into coach-readable reports"
requires-python = ">=3.11"
dependencies = [
    "numpy",
 "matplotlib",
 "scipy>=1.17.1",
]

[project.optional-dependencies]
coach = [
    "google-genai>=1.16.0",
    "PySide6-Essentials>=6.8.0",
    "PySide6-Addons>=6.8.0",
    "qasync>=0.27.1",
    "sounddevice>=0.5.1",
    "moderngl>=5.13.0",
    "dxcam>=0.3.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotter_analyze", "spotter_coach", "spotter_volume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
